id: model-explainer
name: model-explainer
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://rival-pine-03c6c782ef-australiaeast.webapp.fabricapps.net
  data:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: retail
    type: fabric-semanticmodel
    config:
      workspaceId: ${MODEL_WORKSPACE_ID}
      itemId: ${MODEL_ITEM_ID}
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
